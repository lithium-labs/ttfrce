name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build the mod
        run: |
          ./gradlew build
          rm -f build/libs/*-sources.jar

      - name: Create Github Release and upload jar
        uses: softprops/action-gh-release@v3.0.0
        with:
          name: ${{ github.ref_name }}
          files: |
            build/libs/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.ref_name != 'v1.0.0' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
